[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openrouter-coding-harness"
version = "0.1.0"
description = "A small, inspectable coding agent harness built from scratch with OpenRouter"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vineeth Chandra Sai Kandukuri" }]
dependencies = []

[project.scripts]
coding-harness = "openharness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
